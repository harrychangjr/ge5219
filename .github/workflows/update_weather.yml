on:
  schedule:
    - cron: "*/10 * * * *"  # run script every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest #runs on linux vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #Install system dependencies
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y krb5-user libkrb5-dev

      #Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"  

      # Install dependencies (cached)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "arcgis==2.3.0" requests

      # Run python script
      - name: Run weather updater
        run: |
          python update_rh_temp.py

