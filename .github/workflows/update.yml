name: Rainfall Realtime Updater

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
            pip install --upgrade pip
            pip install "arcgis==2.3.0" requests

      - name: Run rainfall updater
        # TEMP: hard-coded credentials inside python file
        # Later you can move them here as env vars or secrets.
        run: |
          python update_sg_rainfall_layer.py
