name: Rainfall Realtime Updater

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ArcGIS Python API
        run: |
          pip install arcgis requests

      - name: Run rainfall updater
        env:
          ARCGIS_USERNAME: "e1025426_gis2025"
          ARCGIS_PASSWORD: "Zzr20010910-"
        run: |
          python update_rainfall_layer.py
